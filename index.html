<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- viewport-fit=cover — контент под вырезами, отступы через env(safe-area-inset-*);
         resizes-content — виртуальная клавиатура уменьшает окно, поле ввода остаётся над ней (п. 8.6) -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <!-- Значения до загрузки бандла; затем i18n.ts синхронизирует их с выбранным языком -->
    <title>Чат MAX через GREEN-API</title>
    <script>
      // Применяет тему до первой отрисовки, чтобы не мелькала светлая тема.
      // Выполняется до загрузки бандла и не может импортировать из src. Держать в синхроне с
      // src/constants/storageKeys.ts (ключ темы) и src/utils/storage.ts (формат JSON).
      (function () {
        var THEME_STORAGE_KEY = 'green-api-max-demo:theme';
        var mode = 'system';

        try {
          var stored = JSON.parse(localStorage.getItem(THEME_STORAGE_KEY) ?? 'null');

          if (stored === 'light' || stored === 'dark' || stored === 'system') {
            mode = stored;
          }
        } catch (_error) {
          mode = 'system';
        }

        var isDark =
          mode === 'dark' ||
          (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);

        document.documentElement.dataset.theme = isDark ? 'dark' : 'light';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
